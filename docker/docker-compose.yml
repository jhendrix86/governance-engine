version: '3.8'

services:
  governance-engine:
    build:
      # Workspace root, not just this repo - needed to reach the
      # autonomy-events sibling package the Dockerfile copies in (see its
      # own comment for why). Run `docker compose -f
      # docker/docker-compose.yml build` from governance-engine/ as
      # before; this context path is relative to this compose file's own
      # location either way.
      context: ../..
      dockerfile: governance-engine/docker/Dockerfile
    container_name: governance-engine
    ports:
      - "8033:8033"
    environment:
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - OTEL_ENABLED=true
      - OTEL_ENDPOINT=http://jaeger:4318
    # No depends_on here - rabbitmq/jaeger moved to shared infra
    # (deploy/docker-compose.infra.yml), a different compose project.
    # Bring that up first: deploy/03-build-and-up.sh infra-up
    networks:
      - os42-shared
    restart: unless-stopped

networks:
  os42-shared:
    external: true
