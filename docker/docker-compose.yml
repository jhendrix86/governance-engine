version: '3.8'

services:
  governance-engine:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: governance-engine
    ports:
      - "8033:8033"
    environment:
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - OTEL_ENABLED=true
      - OTEL_ENDPOINT=http://jaeger:4318
    depends_on:
      - rabbitmq
      - jaeger
    networks:
      - governance-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: governance-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - governance-network
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.50
    container_name: governance-jaeger
    ports:
      - "16686:16686"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - governance-network
    restart: unless-stopped

networks:
  governance-network:
    driver: bridge

volumes:
  rabbitmq-data:
